<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Profil | XOXO Manga</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<header class="site-header">

    <div class="logo">
        XOXO
    </div>


    <nav class="main-nav">

        <a href="index.html">
            Ana Sayfa
        </a>

        <a href="manga.html">
            Manga
        </a>

        <a href="manhwa.html">
            Manhwa
        </a>

        <a href="hakkimizda.html">
            Hakkımızda
        </a>

        <a
            href="profil.html"
            id="authNavLink"
        >
            Profil
        </a>

    </nav>

</header>



<main class="profile-page">

<section class="profile-card">


    <div class="profile-decoration">
        ✦ 🪽 ✦
    </div>


    <h1>
        Profilim
    </h1>


    <div class="avatar-wrapper">

        <div
            id="avatarPlaceholder"
            class="avatar-placeholder"
        >
            ♡
        </div>


        <img
            id="profileAvatar"
            class="profile-avatar"
            alt="Profil Fotoğrafı"
        >

    </div>


    <div
        id="profileName"
        class="profile-name"
    >
        Yükleniyor...
    </div>


    <div
        id="profileEmail"
        class="profile-email"
    >
        Yükleniyor...
    </div>


    <div class="profile-status">
        XOXO Manga üyesi ♡
    </div>


    <input
        type="file"
        id="avatarInput"
        accept="image/jpeg,image/png,image/webp,image/gif"
    >


    <button
        type="button"
        id="avatarButton"
        class="avatar-button"
    >
        Profil Fotoğrafı Seç
    </button>


    <div
        id="profileMessage"
        aria-live="polite"
    ></div>


    <button
        type="button"
        id="logoutButton"
        class="logout-button"
    >
        Çıkış Yap
    </button>


</section>

</main>



<script>


const SUPABASE_URL =
    "https://gldvzlfuupettcauexfy.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



const profileAvatar =
    document.getElementById(
        "profileAvatar"
    );


const avatarPlaceholder =
    document.getElementById(
        "avatarPlaceholder"
    );


const profileName =
    document.getElementById(
        "profileName"
    );


const profileEmail =
    document.getElementById(
        "profileEmail"
    );


const avatarInput =
    document.getElementById(
        "avatarInput"
    );


const avatarButton =
    document.getElementById(
        "avatarButton"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


const profileMessage =
    document.getElementById(
        "profileMessage"
    );


const authNavLink =
    document.getElementById(
        "authNavLink"
    );



function showMessage(
    text,
    type = ""
) {

    profileMessage.textContent =
        text;

    profileMessage.className =
        type;

}



function showAvatar(url) {

    if (url) {

        profileAvatar.src =
            url;

        profileAvatar.style.display =
            "block";

        avatarPlaceholder.style.display =
            "none";

    } else {

        profileAvatar.removeAttribute(
            "src"
        );

        profileAvatar.style.display =
            "none";

        avatarPlaceholder.style.display =
            "flex";

    }

}



function avatarPath(userId) {

    return userId + "/avatar";

}



async function loadAvatar(userId) {

    const { data } =
        supabaseClient.storage
            .from("avatars")
            .getPublicUrl(
                avatarPath(userId)
            );


    if (
        !data ||
        !data.publicUrl
    ) {

        showAvatar(null);

        return;

    }


    const url =
        data.publicUrl +
        "?t=" +
        Date.now();


    const image =
        new Image();


    image.onload = () => {

        showAvatar(url);

    };


    image.onerror = () => {

        showAvatar(null);

    };


    image.src = url;

}



async function loadProfile() {

    const { data, error } =
        await supabaseClient.auth
            .getUser();


    if (
        error ||
        !data ||
        !data.user
    ) {

        window.location.replace(
            "auth.html"
        );

        return;

    }


    const user =
        data.user;


    const metadata =
        user.user_metadata || {};


    profileName.textContent =
        metadata.username ||
        metadata.name ||
        metadata.display_name ||
        "XOXO Manga Üyesi";


    profileEmail.textContent =
        user.email ||
        "XOXO Manga üyesi ♡";


    await loadAvatar(
        user.id
    );

}



/* =========================
   FOTOĞRAF SEÇ
========================= */

avatarButton.addEventListener(
    "click",
    () => {

        avatarInput.click();

    }
);



/* =========================
   FOTOĞRAF YÜKLE
========================= */

avatarInput.addEventListener(
    "change",
    async () => {

        const file =
            avatarInput.files &&
            avatarInput.files[0];


        if (!file) {
            return;
        }


        if (
            file.size >
            5 * 1024 * 1024
        ) {

            showMessage(
                "Fotoğraf en fazla 5 MB olabilir.",
                "error"
            );

            avatarInput.value =
                "";

            return;

        }


        const allowed = [

            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif"

        ];


        if (
            !allowed.includes(
                file.type
            )
        ) {

            showMessage(
                "Lütfen JPG, PNG, WEBP veya GIF seç.",
                "error"
            );

            avatarInput.value =
                "";

            return;

        }


        avatarButton.disabled =
            true;


        showMessage(
            "Fotoğraf yükleniyor..."
        );


        try {

            const { data, error } =
                await supabaseClient.auth
                    .getUser();


            if (
                error ||
                !data.user
            ) {

                window.location.replace(
                    "auth.html"
                );

                return;

            }


            const path =
                avatarPath(
                    data.user.id
                );


            const { error: uploadError } =
                await supabaseClient.storage
                    .from("avatars")
                    .upload(
                        path,
                        file,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                true,

                            contentType:
                                file.type
                        }
                    );


            if (uploadError) {
                throw uploadError;
            }


            await loadAvatar(
                data.user.id
            );


            showMessage(
                "Profil fotoğrafın güncellendi ♡",
                "success"
            );


        } catch (error) {

            console.error(error);


            showMessage(
                "Fotoğraf yüklenemedi: " +
                (
                    error.message ||
                    "Bilinmeyen hata"
                ),
                "error"
            );


        } finally {

            avatarButton.disabled =
                false;

            avatarInput.value =
                "";

        }

    }
);



/* =========================
   ÇIKIŞ
========================= */

logoutButton.addEventListener(
    "click",
    async () => {

        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "Çıkış yapılıyor...";


        const { error } =
            await supabaseClient.auth
                .signOut();


        if (error) {

            showMessage(
                error.message,
                "error"
            );

            logoutButton.disabled =
                false;

            logoutButton.textContent =
                "Çıkış Yap";

            return;

        }


        window.location.replace(
            "auth.html"
        );

    }
);



/* =========================
   PROFİLİ BAŞLAT
========================= */

(async () => {

    const { data } =
        await supabaseClient.auth
            .getSession();


    if (!data.session) {

        window.location.replace(
            "auth.html"
        );

        return;

    }


    authNavLink.textContent =
        "Profil";


    authNavLink.href =
        "profil.html";


    await loadProfile();

})();

</script>

</body>
</html>
