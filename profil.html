<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil | XOXO Manga</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>

    <h1>XOXO</h1>

    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="manga.html">Manga</a>
        <a href="manhwa.html">Manhwa</a>
        <a href="hakkimizda.html">Hakkımızda</a>
        <a href="profil.html">Profil</a>
        <a href="auth.html" id="loginLink">Giriş Yap</a>
    </nav>

</header>


<main>

    <section class="profile-card">

        <div class="profile-decoration">
            ✦ 🪽 ✦
        </div>

        <h2>Profilim</h2>

        <div class="avatar-container">

            <img
                id="avatar"
                src=""
                alt="Profil Fotoğrafı"
                class="avatar"
            >

            <div id="avatarPlaceholder" class="avatar-placeholder">
                ♡
            </div>

        </div>


        <div class="profile-info">

            <h3 id="userEmail">
                Yükleniyor...
            </h3>

            <p id="memberText">
                XOXO Manga üyesi ♡
            </p>

        </div>


        <label for="avatarInput" class="upload-button">
            Profil Fotoğrafı Seç
        </label>

        <input
            type="file"
            id="avatarInput"
            accept="image/png,image/jpeg,image/webp"
            hidden
        >


        <p id="uploadMessage"></p>


        <button
            id="logoutButton"
            class="logout-button"
            type="button"
        >
            Çıkış Yap
        </button>

    </section>

</main>


<footer>

    <p>
        © 2026 XOXO Manga
    </p>

</footer>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "BURAYA_SUPABASE_URL";
const SUPABASE_ANON_KEY = "BURAYA_SUPABASE_ANON_KEY";

const { createClient } = supabase;

const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   ELEMENTLER
========================================================= */

const avatar = document.getElementById("avatar");
const avatarPlaceholder = document.getElementById("avatarPlaceholder");
const avatarInput = document.getElementById("avatarInput");

const userEmail = document.getElementById("userEmail");
const uploadMessage = document.getElementById("uploadMessage");

const logoutButton = document.getElementById("logoutButton");
const loginLink = document.getElementById("loginLink");


/* =========================================================
   PROFİL FOTOĞRAFI GÖSTER
========================================================= */

function showAvatar(url) {

    if (!url) {

        avatar.style.display = "none";
        avatarPlaceholder.style.display = "flex";

        return;
    }

    avatar.src = url;
    avatar.style.display = "block";
    avatarPlaceholder.style.display = "none";
}


/* =========================================================
   KULLANICIYI YÜKLE
========================================================= */

async function loadProfile() {

    const {
        data: {
            user
        },
        error
    } = await supabaseClient.auth.getUser();


    if (error || !user) {

        window.location.href = "auth.html";

        return;
    }


    /* E-posta */

    userEmail.textContent = user.email;


    /* Profil fotoğrafı */

    const avatarUrl =
        user.user_metadata?.avatar_url;


    if (avatarUrl) {

        showAvatar(avatarUrl);

    } else {

        showAvatar(null);
    }


    /* Giriş yapıldıysa nav'daki Giriş Yap yerine Profil göster */

    loginLink.textContent = "Profil";
    loginLink.href = "profil.html";
}


/* =========================================================
   PROFİL FOTOĞRAFI YÜKLE
========================================================= */

avatarInput.addEventListener("change", async function () {

    const file = this.files[0];

    if (!file) {
        return;
    }


    /* Dosya tipi kontrolü */

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];


    if (!allowedTypes.includes(file.type)) {

        uploadMessage.textContent =
            "Lütfen JPG, PNG veya WEBP fotoğraf seç.";

        uploadMessage.className = "error-message";

        avatarInput.value = "";

        return;
    }


    /* Boyut kontrolü - 5 MB */

    if (file.size > 5 * 1024 * 1024) {

        uploadMessage.textContent =
            "Fotoğraf en fazla 5 MB olabilir.";

        uploadMessage.className = "error-message";

        avatarInput.value = "";

        return;
    }


    uploadMessage.textContent =
        "Fotoğraf yükleniyor...";

    uploadMessage.className =
        "loading-message";


    try {

        /* Kullanıcı */

        const {
            data: {
                user
            },
            error: userError
        } = await supabaseClient.auth.getUser();


        if (userError || !user) {

            window.location.href = "auth.html";

            return;
        }


        /*
         * Her kullanıcı için aynı dosya yolu.
         *
         * Böylece yeni fotoğraf yüklenince
         * mevcut fotoğraf UPDATE edilir.
         */

        const filePath =
            `${user.id}/avatar`;


        /* Supabase Storage'a yükle */

        const {
            error: uploadError
        } = await supabaseClient.storage
            .from("avatars")
            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",
                    upsert: true,
                    contentType: file.type
                }
            );


        if (uploadError) {

            console.error(uploadError);

            uploadMessage.textContent =
                "Fotoğraf yüklenirken hata oluştu.";

            uploadMessage.className =
                "error-message";

            return;
        }


        /* Public URL al */

        const {
            data: publicData
        } = supabaseClient.storage
            .from("avatars")
            .getPublicUrl(filePath);


        const avatarUrl =
            publicData.publicUrl
            + "?t="
            + Date.now();


        /* URL'yi kullanıcı metadata'sına kaydet */

        const {
            error: metadataError
        } = await supabaseClient.auth.updateUser({

            data: {
                avatar_url: avatarUrl
            }

        });


        if (metadataError) {

            console.error(metadataError);

            uploadMessage.textContent =
                "Fotoğraf yüklendi fakat profil bilgisi kaydedilemedi.";

            uploadMessage.className =
                "error-message";

            return;
        }


        /* Fotoğrafı ekranda göster */

        showAvatar(avatarUrl);


        uploadMessage.textContent =
            "Profil fotoğrafın başarıyla güncellendi! ♡";

        uploadMessage.className =
            "success-message";


    } catch (error) {

        console.error(error);

        uploadMessage.textContent =
            "Beklenmeyen bir hata oluştu.";

        uploadMessage.className =
            "error-message";

    }


    avatarInput.value = "";

});


/* =========================================================
   ÇIKIŞ YAP
========================================================= */

logoutButton.addEventListener("click", async function () {

    logoutButton.disabled = true;

    logoutButton.textContent =
        "Çıkış yapılıyor...";


    const {
        error
    } = await supabaseClient.auth.signOut();


    if (error) {

        console.error(error);

        logoutButton.disabled = false;

        logoutButton.textContent =
            "Çıkış Yap";

        return;
    }


    window.location.href =
        "auth.html";
});


/* =========================================================
   BAŞLAT
========================================================= */

loadProfile();

</script>


<style>

/* =========================================================
   PROFILE
========================================================= */

.profile-card {

    width: 100%;
    max-width: 500px;

    margin: 70px auto;

    padding: 50px 35px;

    text-align: center;

    background: #29252b;

    border: 1px solid #4b424c;

    border-radius: 30px;

    box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.35);

}


/* DECORATION */

.profile-decoration {

    font-size: 30px;

    margin-bottom: 15px;

}


/* TITLE */

.profile-card h2 {

    margin: 0 0 30px;

    color: #ed8fba;

    font-size: 32px;

}


/* AVATAR */

.avatar-container {

    position: relative;

    width: 150px;
    height: 150px;

    margin: 0 auto 25px;

}


.avatar {

    width: 150px;
    height: 150px;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid #ed8fba;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35);

    display: none;

}


.avatar-placeholder {

    width: 150px;
    height: 150px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 2px dashed #ed8fba;

    background: #211e23;

    color: #ed8fba;

    font-size: 55px;

}


/* INFO */

.profile-info h3 {

    margin: 10px 0;

    color: #f5dce9;

    font-size: 18px;

    word-break: break-word;

}


.profile-info p {

    margin: 0 0 25px;

    color: #aaa0a8;

    font-size: 14px;

}


/* UPLOAD BUTTON */

.upload-button {

    display: inline-block;

    padding: 13px 22px;

    border-radius: 14px;

    background: #ed8fba;

    color: #211e23;

    font-weight: bold;

    font-size: 14px;

    cursor: pointer;

    transition: 0.2s;

}


.upload-button:hover {

    transform: translateY(-1px);

    filter: brightness(1.05);

}


/* MESSAGE */

#uploadMessage {

    min-height: 20px;

    margin: 18px 0;

    font-size: 13px;

}


.success-message {

    color: #8fe0b0;

}


.error-message {

    color: #f28fa8;

}


.loading-message {

    color: #ed8fba;

}


/* LOGOUT */

.logout-button {

    display: block;

    width: 100%;

    margin-top: 25px;

    padding: 13px;

    border: 1px solid #5a505a;

    border-radius: 14px;

    background: transparent;

    color: #cfc5cd;

    font-size: 14px;

    cursor: pointer;

    transition: 0.2s;

}


.logout-button:hover {

    border-color: #ed8fba;

    color: #ed8fba;

}


.logout-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;

}


/* MOBILE */

@media (max-width: 600px) {

    .profile-card {

        margin: 40px auto;

        padding: 40px 22px;

        border-radius: 24px;

    }

}

</style>

</body>
</html>
