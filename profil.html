<!DOCTYPE html>
<html lang="tr">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profil - XOXO Manga</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

<header class="site-header">

    <div class="logo">
        XOXO
    </div>

    <nav class="main-nav">

        <a href="index.html">
            Ana Sayfa
        </a>

        <a href="manga.html">
            Manga
        </a>

        <a href="manhwa.html">
            Manhwa
        </a>

        <a href="hakkimizda.html">
            Hakkımızda
        </a>

        <a href="profil.html">
            Profil
        </a>

        <a href="auth.html">
            Giriş Yap
        </a>

    </nav>

</header>


<main class="profile-page">


    <div class="profile-card">

        <div class="profile-decoration">
            ✦ 🪽 ✦
        </div>


        <h1>
            Profilim
        </h1>


        <!-- PROFİL FOTOĞRAFI -->

        <div class="avatar-wrapper">

            <img
                id="avatar"
                src=""
                alt="Profil Fotoğrafı"
                class="profile-avatar"
            >

            <div
                id="avatar-placeholder"
                class="avatar-placeholder"
            >
                ♡
            </div>

        </div>


        <input
            type="file"
            id="avatar-input"
            accept="image/png,image/jpeg,image/webp"
            hidden
        >


        <button
            type="button"
            id="avatar-button"
            class="profile-button"
        >
            Profil Fotoğrafı Seç
        </button>


        <div id="avatar-message"></div>


        <!-- KULLANICI BİLGİSİ -->

        <div class="profile-info">

            <h2 id="username">
                Yükleniyor...
            </h2>

            <p id="email">
                Yükleniyor...
            </p>

            <p class="member-text">
                XOXO Manga üyesi ♡
            </p>

        </div>


        <button
            type="button"
            id="logout-button"
            class="logout-button"
        >
            Çıkış Yap
        </button>


    </div>


</main>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://gldvz1fuupettcauexfy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LQRuadaAeDNPSQA1SA32qA_ddQP5g1H";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   ELEMENTLER
========================================================= */

const avatar =
    document.getElementById("avatar");

const avatarPlaceholder =
    document.getElementById("avatar-placeholder");

const avatarInput =
    document.getElementById("avatar-input");

const avatarButton =
    document.getElementById("avatar-button");

const avatarMessage =
    document.getElementById("avatar-message");

const usernameElement =
    document.getElementById("username");

const emailElement =
    document.getElementById("email");

const logoutButton =
    document.getElementById("logout-button");


/* =========================================================
   MESAJ
========================================================= */

function showAvatarMessage(text, type = "") {

    avatarMessage.textContent = text;
    avatarMessage.className = type;

}


/* =========================================================
   PROFİLİ YÜKLE
========================================================= */

async function loadProfile() {

    /*
       BURADA AUTH SAYFASINA OTOMATİK OLARAK
       GİDİP GELME YOK.

       Sadece gerçekten session yoksa auth'a gider.
    */

    const {
        data: { session },
        error
    } = await supabaseClient.auth.getSession();


    if (error) {

        console.error(error);

        return;

    }


    if (!session) {

        window.location.replace("auth.html");

        return;

    }


    const user = session.user;


    /* Kullanıcı adı */

    const username =
        user.user_metadata?.username;


    if (username) {

        usernameElement.textContent =
            username;

    } else {

        usernameElement.textContent =
            "XOXO Üyesi";

    }


    /* E-posta */

    emailElement.textContent =
        user.email || "";


    /* Avatar */

    const avatarUrl =
        user.user_metadata?.avatar_url;


    if (avatarUrl) {

        avatar.src = avatarUrl;

        avatar.style.display = "block";

        avatarPlaceholder.style.display =
            "none";

    } else {

        avatar.style.display = "none";

        avatarPlaceholder.style.display =
            "flex";

    }

}


/* =========================================================
   PROFİL FOTOĞRAFI BUTONU
========================================================= */

avatarButton.addEventListener(
    "click",
    () => {

        avatarInput.click();

    }
);


/* =========================================================
   FOTOĞRAF SEÇİLİNCE
========================================================= */

avatarInput.addEventListener(
    "change",
    async () => {

        const file =
            avatarInput.files[0];


        if (!file) {

            return;

        }


        /* Dosya boyutu */

        if (file.size > 5 * 1024 * 1024) {

            showAvatarMessage(
                "Fotoğraf en fazla 5 MB olabilir.",
                "error"
            );

            avatarInput.value = "";

            return;

        }


        /* Dosya tipi */

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];


        if (!allowedTypes.includes(file.type)) {

            showAvatarMessage(
                "Sadece JPG, PNG veya WEBP yükleyebilirsin.",
                "error"
            );

            avatarInput.value = "";

            return;

        }


        avatarButton.disabled = true;

        avatarButton.textContent =
            "Yükleniyor...";

        showAvatarMessage("");


        const {
            data: { session }
        } = await supabaseClient.auth.getSession();


        if (!session) {

            window.location.replace("auth.html");

            return;

        }


        const user = session.user;


        /*
           Her kullanıcı için sabit klasör.
           Böylece başka kullanıcıların dosyalarına
           erişim verilmez.
        */

        const extension =
            file.name.split(".").pop().toLowerCase();


        const filePath =
            user.id + "/avatar." + extension;


        /* Önce eski avatarları temizlemek için
           olası dosya isimlerini bulmaya çalışıyoruz. */

        const possibleFiles = [
            user.id + "/avatar.jpg",
            user.id + "/avatar.jpeg",
            user.id + "/avatar.png",
            user.id + "/avatar.webp"
        ];


        const filesToRemove =
            possibleFiles.filter(
                path => path !== filePath
            );


        if (filesToRemove.length > 0) {

            await supabaseClient
                .storage
                .from("avatars")
                .remove(filesToRemove);

        }


        /*
           Yeni fotoğrafı yükle.
        */

        const {
            error: uploadError
        } =
            await supabaseClient
                .storage
                .from("avatars")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: true,
                        contentType: file.type
                    }
                );


        if (uploadError) {

            console.error(uploadError);

            showAvatarMessage(
                "Fotoğraf yüklenemedi: " +
                uploadError.message,
                "error"
            );

            avatarButton.disabled = false;

            avatarButton.textContent =
                "Profil Fotoğrafı Seç";

            return;

        }


        /*
           Public URL al.
        */

        const {
            data: publicData
        } =
            supabaseClient
                .storage
                .from("avatars")
                .getPublicUrl(filePath);


        const publicUrl =
            publicData.publicUrl +
            "?t=" +
            Date.now();


        /*
           URL'yi kullanıcının metadata'sına kaydet.
        */

        const {
            error: updateError
        } =
            await supabaseClient.auth.updateUser({

                data: {

                    avatar_url: publicUrl

                }

            });


        if (updateError) {

            console.error(updateError);

            showAvatarMessage(
                "Fotoğraf kaydedilemedi.",
                "error"
            );

            avatarButton.disabled = false;

            avatarButton.textContent =
                "Profil Fotoğrafı Seç";

            return;

        }


        /*
           Ekranda hemen göster.
        */

        avatar.src = publicUrl;

        avatar.style.display = "block";

        avatarPlaceholder.style.display =
            "none";


        showAvatarMessage(
            "Profil fotoğrafın güncellendi ♡",
            "success"
        );


        avatarButton.disabled = false;

        avatarButton.textContent =
            "Profil Fotoğrafını Değiştir";

    }
);


/* =========================================================
   ÇIKIŞ
========================================================= */

logoutButton.addEventListener(
    "click",
    async () => {

        logoutButton.disabled = true;

        logoutButton.textContent =
            "Çıkış yapılıyor...";


        const { error } =
            await supabaseClient.auth.signOut();


        if (error) {

            console.error(error);

            logoutButton.disabled = false;

            logoutButton.textContent =
                "Çıkış Yap";

            return;

        }


        /*
           Çıkıştan sonra sadece auth'a git.
        */

        window.location.replace("auth.html");

    }
);


/* =========================================================
   BAŞLAT
========================================================= */

loadProfile();

</script>

</body>
</html>
