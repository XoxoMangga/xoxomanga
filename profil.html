<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil | XOXO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="logo">
        XOXO
    </div>

    <nav class="main-nav">
        <a href="index.html">Ana Sayfa</a>
        <a href="manga.html">Manga</a>
        <a href="manhwa.html">Manhwa</a>
        <a href="hakkimizda.html">Hakkımızda</a>
        <a href="profil.html">Profil</a>
        <a href="auth.html">Giriş Yap</a>
    </nav>

</header>

<main class="profile-page">

    <section class="profile">

        <div class="angel">
            ✦ 🪽 ✦
        </div>

        <h1>Profilim</h1>

        <p class="profile-email" id="profileEmail">
            Kullanıcı bilgileri yükleniyor...
        </p>

        <button
            class="logout-button"
            id="logoutBtn"
            type="button"
        >
            Çıkış Yap
        </button>

    </section>

</main>

<footer class="site-footer">
    © 2026 XOXO Manga
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://gldvzlfuupettcauexfy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

async function loadProfile() {

    const {
        data: {
            user
        }
    } = await db.auth.getUser();

    if (!user) {
        window.location.href = "auth.html";
        return;
    }

    document.getElementById("profileEmail").textContent =
        user.email || "E-posta bulunamadı.";
}

document
    .getElementById("logoutBtn")
    .addEventListener("click", async function () {

        const { error } = await db.auth.signOut();

        if (error) {
            alert(error.message);
            return;
        }

        window.location.href = "index.html";
    });

loadProfile();

</script>

</body>
</html>
