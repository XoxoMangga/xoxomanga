<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profil | XOXO</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="site-header">

    <div class="logo">
        XOXO
    </div>

    <nav class="main-nav">

        <a href="index.html">
            Ana Sayfa
        </a>

        <a href="manga.html">
            Manga
        </a>

        <a href="manhwa.html">
            Manhwa
        </a>

        <a href="hakkimizda.html">
            Hakkımızda
        </a>

        <a href="auth.html" id="authNavLink">
            Giriş Yap
        </a>

    </nav>

</header>


<main>

    <section class="profile-page">

        <div class="profile">

            <div class="angel">
                ✦ 🪽 ✦
            </div>

            <h2>
                Profil
            </h2>

            <p id="userEmail">
                Yükleniyor...
            </p>

            <button
                id="logoutButton"
                class="auth-button"
                type="button"
            >
                Çıkış Yap
            </button>

        </div>

    </section>

</main>


<footer>

    <p>
        © 2026 XOXO Manga
    </p>

</footer>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase = createClient(

    "https://gldvzlfuupettcauexfy.supabase.co",

    "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H"

);


const authNavLink =
    document.getElementById("authNavLink");

const userEmail =
    document.getElementById("userEmail");

const logoutButton =
    document.getElementById("logoutButton");


async function loadProfile() {

    const {
        data: { session }
    } = await supabase.auth.getSession();


    if (!session) {

        window.location.href = "auth.html";

        return;

    }


    userEmail.textContent =
        session.user.email;


    authNavLink.textContent =
        "Profil";

    authNavLink.href =
        "profil.html";

}


logoutButton.addEventListener(
    "click",
    async () => {

        logoutButton.disabled = true;

        logoutButton.textContent =
            "Çıkış yapılıyor...";


        const { error } =
            await supabase.auth.signOut();


        if (error) {

            console.error(error);

            logoutButton.disabled = false;

            logoutButton.textContent =
                "Çıkış Yap";

            return;

        }


        window.location.href =
            "index.html";

    }
);


loadProfile();

</script>


</body>
</html>
