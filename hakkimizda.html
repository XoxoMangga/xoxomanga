<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase = createClient(

    "https://gldvzlfuupettcauexfy.supabase.co",

    "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H"

);


async function updateAuthMenu() {

    const link =
        document.getElementById("authNavLink");

    if (!link) return;


    const {
        data: { session }
    } = await supabase.auth.getSession();


    if (session) {

        link.textContent = "Profil";
        link.href = "profil.html";

    } else {

        link.textContent = "Giriş Yap";
        link.href = "auth.html";

    }

}


updateAuthMenu();


supabase.auth.onAuthStateChange(() => {

    updateAuthMenu();

});

</script>
