<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="logo">
        XOXO
    </div>

    <nav class="main-nav">
        <a href="index.html">Ana Sayfa</a>
        <a href="manga.html">Manga</a>
        <a href="manhwa.html">Manhwa</a>
        <a href="hakkimizda.html">Hakkımızda</a>

        <a href="auth.html" id="authNavLink">
            Giriş Yap
        </a>
    </nav>

</header>


<main>

    <section class="hero">

        <div class="hero-decoration">
            ✦ 🪽 ✦
        </div>

        <h1>XOXO Manga</h1>

        <p>
            Manga ve manhwa dünyasına hoş geldin ♡
        </p>

        <a href="manga.html" class="main-button">
            Mangaları Keşfet
        </a>

    </section>


    <section class="upcoming">

        <h2>Yakında</h2>

        <p>
            Yeni manga ve manhwa içerikleri çok yakında burada.
        </p>

        <div class="angel-line">
            ✦ 🪽 ✦
        </div>

    </section>

</main>


<footer class="site-footer">

    <p>
        © 2026 XOXO Manga
    </p>

</footer>


<script type="module">

    import { createClient }
    from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const supabase = createClient(

        "https://gldvzlfuupettcauexfy.supabase.co",

        "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H"

    );


    async function updateAuthMenu() {

        const authNavLink =
            document.getElementById("authNavLink");

        if (!authNavLink) return;


        const {
            data: { session }
        } = await supabase.auth.getSession();


        if (session) {

            authNavLink.textContent = "Profil";
            authNavLink.href = "profil.html";

        } else {

            authNavLink.textContent = "Giriş Yap";
            authNavLink.href = "auth.html";

        }

    }


    updateAuthMenu();


    supabase.auth.onAuthStateChange(() => {

        updateAuthMenu();

    });

</script>

</body>
</html>
