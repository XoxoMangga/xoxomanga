<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://gldvzlfuupettcauexfy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H";


const { createClient } = supabase;


const db = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const authNav =
    document.getElementById("authNav");


async function updateAuthNav() {

    const {
        data
    } = await db.auth.getSession();


    if (data.session) {

        authNav.textContent =
            "Profil";

        authNav.href =
            "profil.html";

    } else {

        authNav.textContent =
            "Giriş Yap";

        authNav.href =
            "auth.html";

    }

}


updateAuthNav();


db.auth.onAuthStateChange(
    function () {

        updateAuthNav();

    }
);

</script>
