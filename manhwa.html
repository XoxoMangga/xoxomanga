<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manhwa | XOXO</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="site-header">

    <div class="logo">
        XOXO
    </div>

    <nav class="main-nav">

        <a href="index.html">
            Ana Sayfa
        </a>

        <a href="manga.html">
            Manga
        </a>

        <a href="manhwa.html">
            Manhwa
        </a>

        <a href="hakkimizda.html">
            Hakkımızda
        </a>

        <a href="auth.html" id="authNavLink">
            Giriş Yap
        </a>

    </nav>

</header>


<main>

  <section class="manhwa-page">

    <div class="manhwa-card">

        <img
            src="wish-upon-a-star.jpg"
            alt="Wish Upon a Star"
            class="manhwa-cover"
        >

        <div class="manhwa-info">

            <div class="angel">
                ✦ 🪽 ✦
            </div>

            <h1>Wish Upon a Star</h1>

            <p class="manhwa-type">Manhwa</p>
<div class="rating-box">

    <div class="rating-summary">
        <span class="rating-star">⭐</span>
        <strong id="averageRating">0.0</strong>
        <span>/ 5</span>
        <small id="ratingCount">(Henüz oy yok)</small>
    </div>

    <p>Bu manhwaya puan ver:</p>

    <div class="rating-stars">
        <button type="button" data-rating="1">☆</button>
        <button type="button" data-rating="2">☆</button>
        <button type="button" data-rating="3">☆</button>
        <button type="button" data-rating="4">☆</button>
        <button type="button" data-rating="5">☆</button>
    </div>

    <p id="ratingMessage"></p>

</div>

</section>
</main>


<footer>

    <p>
        © 2026 XOXO Manga
    </p>

</footer>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase = createClient(

    "https://gldvzlfuupettcauexfy.supabase.co",

    "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H"

);


async function updateAuthMenu() {

    const link =
        document.getElementById("authNavLink");

    if (!link) return;


    const {
        data: { session }
    } = await supabase.auth.getSession();


    if (session) {

        link.textContent = "Profil";
        link.href = "profil.html";

    } else {

        link.textContent = "Giriş Yap";
        link.href = "auth.html";

    }

}


updateAuthMenu();


supabase.auth.onAuthStateChange(() => {

    updateAuthMenu();

});

</script>

<script>
const mangaId = "wish-upon-a-star";

const ratingButtons = document.querySelectorAll(".rating-stars button");
const ratingMessage = document.getElementById("ratingMessage");

ratingButtons.forEach(button => {
    button.addEventListener("click", async () => {

        const rating = Number(button.dataset.rating);

        const {
            data: { user }
        } = await supabase.auth.getUser();

        if (!user) {
            ratingMessage.textContent = "Oy vermek için giriş yapmalısın.";
            return;
        }

        const { error } = await supabase
            .from("ratings")
            .insert({
                user_id: user.id,
                manga_id: mangaId,
                rating: rating
            });

        if (error) {
            console.error(error);
            ratingMessage.textContent = "Oy verirken bir hata oluştu.";
            return;
        }

        ratingMessage.textContent = "Oyun kaydedildi! ⭐";
        loadRating();
    });
});


async function loadRating() {

    const { data, error } = await supabase
        .from("ratings")
        .select("rating")
        .eq("manga_id", mangaId);

    if (error) {
        console.error(error);
        return;
    }

    if (!data || data.length === 0) {
        document.getElementById("averageRating").textContent = "0.0";
        document.getElementById("ratingCount").textContent = "(Henüz oy yok)";
        return;
    }

    const total = data.reduce((sum, item) => sum + item.rating, 0);
    const average = (total / data.length).toFixed(1);

    document.getElementById("averageRating").textContent = average;
    document.getElementById("ratingCount").textContent =
        `(${data.length} oy)`;
}

loadRating();
</script>
</body>
</html>
