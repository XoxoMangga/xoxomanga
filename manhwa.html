<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manhwa | XOXO</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="site-header">

    <div class="logo">
        XOXO
    </div>

    <nav class="main-nav">

        <a href="index.html">
            Ana Sayfa
        </a>

        <a href="manga.html">
            Manga
        </a>

        <a href="manhwa.html">
            Manhwa
        </a>

        <a href="hakkimizda.html">
            Hakkımızda
        </a>

        <a href="auth.html" id="authNavLink">
            Giriş Yap
        </a>

    </nav>

</header>


<main>

  <section class="manhwa-page">

    <div class="manhwa-card">

        <img
            src="wish-upon-a-star.jpg"
            alt="Wish Upon a Star"
            class="manhwa-cover"
        >

        <div class="manhwa-info">

            <div class="angel">
                ✦ 🪽 ✦
            </div>

            <h1>Wish Upon a Star</h1>

            <p class="manhwa-type">Manhwa</p>

            <div class="rating">
                <span>⭐</span>
                <strong>0.0</strong>
                <span>/ 5</span>
                <small>(Henüz oy yok)</small>
            </div>

            <p class="manhwa-description">
                Wish Upon a Star
            </p>

            <a href="#" class="read-button">
                Bölüm 1'e Başla
            </a>

        </div>

</section>
</main>


<footer>

    <p>
        © 2026 XOXO Manga
    </p>

</footer>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase = createClient(

    "https://gldvzlfuupettcauexfy.supabase.co",

    "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H"

);


async function updateAuthMenu() {

    const link =
        document.getElementById("authNavLink");

    if (!link) return;


    const {
        data: { session }
    } = await supabase.auth.getSession();


    if (session) {

        link.textContent = "Profil";
        link.href = "profil.html";

    } else {

        link.textContent = "Giriş Yap";
        link.href = "auth.html";

    }

}


updateAuthMenu();


supabase.auth.onAuthStateChange(() => {

    updateAuthMenu();

});

</script>


</body>
</html>
