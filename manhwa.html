<script type="module">

    import { createClient }
        from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const supabase = createClient(

        "https://gldvzlfuupettcauexfy.supabase.co",

        "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H"

    );



    /* =========================
       GİRİŞ MENÜSÜ
    ========================== */

    async function updateAuthMenu() {

        const link =
            document.getElementById("authNavLink");


        if (!link) return;


        const {

            data: { session }

        } = await supabase.auth.getSession();


        if (session) {

            link.textContent = "Profil";

            link.href = "profil.html";

        } else {

            link.textContent = "Giriş Yap";

            link.href = "auth.html";

        }

    }


    updateAuthMenu();


    supabase.auth.onAuthStateChange(() => {

        updateAuthMenu();

    });



    /* =========================
       PUAN SİSTEMİ
    ========================== */

    const ratingConfigs = [

        {
            cardTitle: "My First Love",

            mangaId: "my-first-love",

            cardSelector:
                ".manhwa-card:nth-child(1)",

            averageId:
                "averageRatingMyFirstLove",

            countId:
                "ratingCountMyFirstLove",

            messageId:
                "ratingMessageMyFirstLove"
        },


        {
            cardTitle: "Wish Upon a Star",

            mangaId: "wish-upon-a-star",

            cardSelector:
                ".manhwa-card:nth-child(2)",

            averageId:
                "averageRatingWishUponAStar",

            countId:
                "ratingCountWishUponAStar",

            messageId:
                "ratingMessageWishUponAStar"
        }

    ];



    /* =========================
       PUAN BUTONLARI
    ========================== */

    function setupRating(config) {

        const card =
            document.querySelector(
                config.cardSelector
            );


        if (!card) return;


        const ratingButtons =
            card.querySelectorAll(
                ".rating-stars button"
            );


        const ratingMessage =
            document.getElementById(
                config.messageId
            );


        ratingButtons.forEach(button => {

            button.addEventListener(
                "click",
                async () => {

                    const rating =
                        Number(
                            button.dataset.rating
                        );


                    const {

                        data: { user }

                    } =
                        await supabase.auth.getUser();



                    if (!user) {

                        ratingMessage.textContent =
                            "Oy vermek için giriş yapmalısın.";

                        return;

                    }



                    const { error } =
                        await supabase

                            .from("ratings")

                            .insert({

                                user_id:
                                    user.id,

                                manga_id:
                                    config.mangaId,

                                rating:
                                    rating

                            });



                    if (error) {

                        console.error(error);

                        ratingMessage.textContent =
                            "Oy verirken bir hata oluştu.";

                        return;

                    }



                    ratingMessage.textContent =
                        "Oyun kaydedildi! ⭐";


                    loadRating(config);

                }

            );

        });


        loadRating(config);

    }



    /* =========================
       ORTALAMA PUANI GETİR
    ========================== */

    async function loadRating(config) {


        const { data, error } =
            await supabase

                .from("ratings")

                .select("rating")

                .eq(
                    "manga_id",
                    config.mangaId
                );


        if (error) {

            console.error(error);

            return;

        }



        const averageElement =
            document.getElementById(
                config.averageId
            );


        const countElement =
            document.getElementById(
                config.countId
            );



        if (!data || data.length === 0) {

            averageElement.textContent =
                "0.0";

            countElement.textContent =
                "(Henüz oy yok)";

            return;

        }



        const total =
            data.reduce(

                (sum, item) =>
                    sum + Number(item.rating),

                0

            );


        const average =
            (
                total / data.length
            ).toFixed(1);



        averageElement.textContent =
            average;


        countElement.textContent =
            `(${data.length} oy)`;

    }



    /* =========================
       PUAN SİSTEMLERİNİ BAŞLAT
    ========================== */

    ratingConfigs.forEach(
        setupRating
    );

const commentConfigs = [
    {
        mangaId: "my-first-love",
        inputId: "commentInputMyFirstLove",
        buttonId: "commentButtonMyFirstLove",
        listId: "commentsListMyFirstLove"
    },
    {
        mangaId: "wish-upon-a-star",
        inputId: "commentInputWishUponAStar",
        buttonId: "commentButtonWishUponAStar",
        listId: "commentsListWishUponAStar"
    }
];


async function loadComments(config) {

    const list =
        document.getElementById(config.listId);

    const { data, error } = await supabase
        .from("comments")
        .select("id, user_id, comment, created_at")
        .eq("manga_id", config.mangaId)
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        list.innerHTML =
            "<p>Yorumlar yüklenemedi.</p>";
        return;
    }

    if (!data || data.length === 0) {
        list.innerHTML =
            "<p>Henüz yorum yok. İlk yorumu sen yap! ♡</p>";
        return;
    }

    list.innerHTML = "";

    data.forEach(item => {

        const comment = document.createElement("div");

        comment.className = "comment-item";

        comment.innerHTML = `
            <strong>Kullanıcı</strong>
            <small>
                ${new Date(item.created_at).toLocaleDateString("tr-TR")}
            </small>
            <p></p>
        `;

        comment.querySelector("p").textContent =
            item.comment;

        list.appendChild(comment);

    });
}


function setupComments(config) {

    const input =
        document.getElementById(config.inputId);

    const button =
        document.getElementById(config.buttonId);


    button.addEventListener("click", async () => {

        const text = input.value.trim();

        if (!text) {
            alert("Önce yorumunu yaz.");
            return;
        }


        const {
            data: { user }
        } = await supabase.auth.getUser();


        if (!user) {

            alert(
                "Yorum yapmak için giriş yapmalısın."
            );

            return;
        }


        button.disabled = true;
        button.textContent = "Gönderiliyor...";


        const { error } = await supabase
            .from("comments")
            .insert({
                user_id: user.id,
                manga_id: config.mangaId,
                comment: text
            });


        if (error) {

            console.error(error);

            alert(
                "Yorum gönderilirken bir hata oluştu."
            );

        } else {

            input.value = "";

            await loadComments(config);

        }


        button.disabled = false;
        button.textContent = "Yorum Yap";

    });


    loadComments(config);
}


commentConfigs.forEach(
    setupComments
);
</script>
