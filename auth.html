<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giriş Yap - XOXO Manga</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="site-header">

    <div class="logo">
        XOXO
    </div>

    <nav class="main-nav">
        <a href="index.html">Ana Sayfa</a>
        <a href="manga.html">Manga</a>
        <a href="manhwa.html">Manhwa</a>
        <a href="hakkimizda.html">Hakkımızda</a>
        <a href="profil.html">Profil</a>
        <a href="auth.html">Giriş Yap</a>
    </nav>

</header>


<main class="auth-page">

    <div class="auth-box">

        <div class="angel-decoration">
            ✦ 🪽 ✦
        </div>

        <h1>XOXO</h1>

        <p class="auth-subtitle">
            Manga dünyasına hoş geldin ♡
        </p>


        <!-- GİRİŞ -->

        <div id="login-section">

            <h2>Giriş Yap</h2>

            <div class="input-group">
                <label for="login-email">E-posta</label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="E-posta adresin"
                    autocomplete="email"
                >
            </div>


            <div class="input-group">
                <label for="login-password">Şifre</label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Şifren"
                    autocomplete="current-password"
                >
            </div>


            <button
                type="button"
                class="auth-button"
                id="login-button"
            >
                Giriş Yap
            </button>


            <button
                type="button"
                class="forgot-button"
                id="forgot-button"
            >
                Şifremi Unuttum
            </button>


            <p class="switch-text">
                Hesabın yok mu?
            </p>

            <button
                type="button"
                class="switch-button"
                id="show-register"
            >
                Kayıt Ol
            </button>

        </div>


        <!-- KAYIT -->

        <div id="register-section" style="display:none;">

            <h2>Kayıt Ol</h2>


            <div class="input-group">

                <label for="register-username">
                    Kullanıcı Adı
                </label>

                <input
                    type="text"
                    id="register-username"
                    placeholder="Kullanıcı adın"
                    maxlength="30"
                    autocomplete="username"
                >

            </div>


            <div class="input-group">

                <label for="register-email">
                    E-posta
                </label>

                <input
                    type="email"
                    id="register-email"
                    placeholder="E-posta adresin"
                    autocomplete="email"
                >

            </div>


            <div class="input-group">

                <label for="register-password">
                    Şifre
                </label>

                <input
                    type="password"
                    id="register-password"
                    placeholder="En az 6 karakter"
                    autocomplete="new-password"
                >

            </div>


            <button
                type="button"
                class="auth-button"
                id="register-button"
            >
                Kayıt Ol
            </button>


            <p class="switch-text">
                Zaten hesabın var mı?
            </p>

            <button
                type="button"
                class="switch-button"
                id="show-login"
            >
                Giriş Yap
            </button>

        </div>


        <div id="message"></div>


        <footer>
            © 2026 XOXO Manga
        </footer>

    </div>

</main>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://gldvz1fuupettcauexfy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LQRuadaAeDNPSQA1SA32qA_ddQP5g1H";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   ELEMENTLER
========================================================= */

const loginSection = document.getElementById("login-section");
const registerSection = document.getElementById("register-section");

const loginButton = document.getElementById("login-button");
const registerButton = document.getElementById("register-button");

const showRegister = document.getElementById("show-register");
const showLogin = document.getElementById("show-login");

const forgotButton = document.getElementById("forgot-button");

const message = document.getElementById("message");


/* =========================================================
   MESAJ
========================================================= */

function showMessage(text, type = "") {

    message.textContent = text;
    message.className = type;

}


/* =========================================================
   GİRİŞ / KAYIT EKRANI
========================================================= */

showRegister.addEventListener("click", () => {

    loginSection.style.display = "none";
    registerSection.style.display = "block";

    showMessage("");

});


showLogin.addEventListener("click", () => {

    registerSection.style.display = "none";
    loginSection.style.display = "block";

    showMessage("");

});


/* =========================================================
   SAYFA AÇILDIĞINDA SESSION KONTROLÜ
   SADECE AUTH SAYFASI PROFİLE YÖNLENDİRİR
========================================================= */

async function checkExistingSession() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();


    if (session) {

        window.location.replace("profil.html");

    }

}


checkExistingSession();


/* =========================================================
   GİRİŞ
========================================================= */

loginButton.addEventListener("click", async () => {

    const email =
        document.getElementById("login-email").value.trim();

    const password =
        document.getElementById("login-password").value;


    if (!email || !password) {

        showMessage(
            "E-posta ve şifreyi doldurmalısın.",
            "error"
        );

        return;

    }


    loginButton.disabled = true;
    loginButton.textContent = "Giriş yapılıyor...";


    const { error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,
            password: password

        });


    if (error) {

        showMessage(
            "E-posta veya şifre hatalı.",
            "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "Giriş Yap";

        return;

    }


    showMessage(
        "Giriş başarılı ♡",
        "success"
    );


    /*
       Burada sadece BİR KEZ yönlendiriyoruz.
       Profil sayfası tekrar auth'a göndermediği için
       redirect loop oluşmayacak.
    */

    setTimeout(() => {

        window.location.replace("profil.html");

    }, 300);

});


/* =========================================================
   KAYIT
========================================================= */

registerButton.addEventListener("click", async () => {

    const username =
        document
            .getElementById("register-username")
            .value
            .trim();

    const email =
        document
            .getElementById("register-email")
            .value
            .trim();

    const password =
        document
            .getElementById("register-password")
            .value;


    if (!username || !email || !password) {

        showMessage(
            "Tüm alanları doldurmalısın.",
            "error"
        );

        return;

    }


    if (username.length < 3) {

        showMessage(
            "Kullanıcı adı en az 3 karakter olmalı.",
            "error"
        );

        return;

    }


    if (password.length < 6) {

        showMessage(
            "Şifre en az 6 karakter olmalı.",
            "error"
        );

        return;

    }


    registerButton.disabled = true;
    registerButton.textContent = "Kayıt olunuyor...";


    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    username: username,

                    avatar_url: ""

                }

            }

        });


    if (error) {

        showMessage(
            error.message,
            "error"
        );

        registerButton.disabled = false;
        registerButton.textContent = "Kayıt Ol";

        return;

    }


    /*
       E-posta doğrulama açıksa session null olabilir.
       Bu durumda profile göndermiyoruz.
    */

    if (data.session) {

        showMessage(
            "Hesabın oluşturuldu ♡",
            "success"
        );


        setTimeout(() => {

            window.location.replace("profil.html");

        }, 300);

    } else {

        showMessage(
            "Kayıt başarılı ♡ E-posta adresini doğrula.",
            "success"
        );

        registerButton.disabled = false;
        registerButton.textContent = "Kayıt Ol";

    }

});


/* =========================================================
   ŞİFREMİ UNUTTUM
========================================================= */

forgotButton.addEventListener("click", async () => {

    const email =
        document
            .getElementById("login-email")
            .value
            .trim();


    if (!email) {

        showMessage(
            "Önce e-posta adresini yaz.",
            "error"
        );

        return;

    }


    forgotButton.disabled = true;


    const { error } =
        await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
                redirectTo:
                    window.location.origin +
                    "/auth.html"
            }
        );


    if (error) {

        showMessage(
            error.message,
            "error"
        );

    } else {

        showMessage(
            "Şifre yenileme bağlantısı e-posta adresine gönderildi.",
            "success"
        );

    }


    forgotButton.disabled = false;

});

</script>

</body>
</html>
