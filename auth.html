<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giriş Yap - XOXO Manga</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <div class="logo">
            XOXO
        </div>

        <nav class="main-nav">

            <a href="index.html">Ana Sayfa</a>

            <a href="manga.html">Manga</a>

            <a href="manhwa.html">Manhwa</a>

            <a href="hakkimizda.html">Hakkımızda</a>

            <a href="profil.html">Profil</a>

            <a href="auth.html">Giriş Yap</a>

        </nav>

    </header>


    <!-- AUTH -->

    <main class="auth-container">

        <div class="auth-box">

            <div class="angel-decoration">
                ✦ 🪽 ✦
            </div>

            <h1>XOXO</h1>

            <p class="auth-subtitle">
                Manga dünyasına hoş geldin ♡
            </p>


            <!-- GİRİŞ -->

            <section id="login-section">

                <h2>Giriş Yap</h2>


                <div class="input-group">

                    <label for="login-email">
                        E-posta
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="E-posta adresin"
                        autocomplete="email"
                    >

                </div>


                <div class="input-group">

                    <label for="login-password">
                        Şifre
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Şifren"
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="button"
                    class="auth-button"
                    id="login-button"
                >
                    Giriş Yap
                </button>


                <button
                    type="button"
                    class="forgot-button"
                    id="forgot-button"
                >
                    Şifremi Unuttum
                </button>


                <p class="switch-text">
                    Hesabın yok mu?
                </p>


                <button
                    type="button"
                    class="switch-button"
                    id="show-register"
                >
                    Kayıt Ol
                </button>

            </section>


            <!-- KAYIT -->

            <section
                id="register-section"
                style="display: none;"
            >

                <h2>Kayıt Ol</h2>


                <div class="input-group">

                    <label for="register-username">
                        Kullanıcı Adı
                    </label>

                    <input
                        type="text"
                        id="register-username"
                        placeholder="Kullanıcı adın"
                        maxlength="30"
                        autocomplete="username"
                    >

                </div>


                <div class="input-group">

                    <label for="register-email">
                        E-posta
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="E-posta adresin"
                        autocomplete="email"
                    >

                </div>


                <div class="input-group">

                    <label for="register-password">
                        Şifre
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="En az 6 karakter"
                        autocomplete="new-password"
                    >

                </div>


                <button
                    type="button"
                    class="auth-button"
                    id="register-button"
                >
                    Kayıt Ol
                </button>


                <p class="switch-text">
                    Zaten hesabın var mı?
                </p>


                <button
                    type="button"
                    class="switch-button"
                    id="show-login"
                >
                    Giriş Yap
                </button>

            </section>


            <!-- MESAJ -->

            <div
                id="message"
                class="auth-message"
            ></div>


            <footer>
                © 2026 XOXO Manga
            </footer>

        </div>

    </main>


<script>

    /* =========================================
       SUPABASE
    ========================================= */
const SUPABASE_URL =
    "https://gldvzlfuupettcauexfy.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H";


    const { createClient } = supabase;


    const supabaseClient = createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    /* =========================================
       ELEMENTLER
    ========================================= */

    const loginSection =
        document.getElementById("login-section");

    const registerSection =
        document.getElementById("register-section");

    const message =
        document.getElementById("message");


    const showRegister =
        document.getElementById("show-register");

    const showLogin =
        document.getElementById("show-login");


    const loginButton =
        document.getElementById("login-button");

    const registerButton =
        document.getElementById("register-button");

    const forgotButton =
        document.getElementById("forgot-button");


    /* =========================================
       MESAJ
    ========================================= */

    function showMessage(text, type = "error") {

        message.textContent = text;

        message.className =
            "auth-message " + type;

    }


    function clearMessage() {

        message.textContent = "";

        message.className =
            "auth-message";

    }


    /* =========================================
       GİRİŞ / KAYIT GEÇİŞİ
    ========================================= */

    showRegister.addEventListener("click", function () {

        clearMessage();

        loginSection.style.display = "none";

        registerSection.style.display = "block";

    });


    showLogin.addEventListener("click", function () {

        clearMessage();

        registerSection.style.display = "none";

        loginSection.style.display = "block";

    });


    /* =========================================
       GİRİŞ YAP
    ========================================= */

    loginButton.addEventListener("click", async function () {

        clearMessage();

        const email =
            document.getElementById("login-email")
            .value
            .trim();

        const password =
            document.getElementById("login-password")
            .value;


        if (!email || !password) {

            showMessage(
                "Lütfen e-posta ve şifreni gir."
            );

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Giriş yapılıyor...";


        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                throw error;

            }


            if (!data.session) {

                throw new Error(
                    "Oturum oluşturulamadı."
                );

            }


            showMessage(
                "Giriş başarılı ♡",
                "success"
            );


            /*
             * Biraz bekletip profile gönderiyoruz.
             * Böylece Supabase session'ı tamamen
             * kaydetmiş oluyor.
             */

            setTimeout(function () {

                window.location.replace(
                    "profil.html"
                );

            }, 500);


        } catch (error) {

            console.error(error);

            showMessage(
                error.message || "Giriş yapılamadı."
            );

        } finally {

            loginButton.disabled = false;

            loginButton.textContent =
                "Giriş Yap";

        }

    });


    /* =========================================
       KAYIT OL
    ========================================= */

    registerButton.addEventListener("click", async function () {

        clearMessage();


        const username =
            document.getElementById("register-username")
            .value
            .trim();

        const email =
            document.getElementById("register-email")
            .value
            .trim();

        const password =
            document.getElementById("register-password")
            .value;


        /* KONTROLLER */

        if (!username) {

            showMessage(
                "Lütfen bir kullanıcı adı seç."
            );

            return;
        }


        if (username.length < 3) {

            showMessage(
                "Kullanıcı adı en az 3 karakter olmalı."
            );

            return;
        }


        if (!email) {

            showMessage(
                "Lütfen e-posta adresini gir."
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Şifre en az 6 karakter olmalı."
            );

            return;
        }


        registerButton.disabled = true;

        registerButton.textContent =
            "Kayıt oluşturuluyor...";


        try {

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            username: username

                        }

                    }

                });


            if (error) {

                throw error;

            }


            /*
             * Supabase e-posta doğrulamasını
             * açtıysa session hemen oluşmayabilir.
             */

            if (data.session) {

                showMessage(
                    "Kayıt başarılı ♡ Profiline gidiyorsun...",
                    "success"
                );


                setTimeout(function () {

                    window.location.replace(
                        "profil.html"
                    );

                }, 700);

            } else {

                showMessage(
                    "Kayıt başarılı ♡ E-postanı doğruladıktan sonra giriş yapabilirsin.",
                    "success"
                );

            }


        } catch (error) {

            console.error(error);

            showMessage(
                error.message || "Kayıt oluşturulamadı."
            );

        } finally {

            registerButton.disabled = false;

            registerButton.textContent =
                "Kayıt Ol";

        }

    });


    /* =========================================
       ŞİFREMİ UNUTTUM
    ========================================= */

    forgotButton.addEventListener("click", async function () {

        clearMessage();


        const email =
            document.getElementById("login-email")
            .value
            .trim();


        if (!email) {

            showMessage(
                "Önce e-posta adresini yaz."
            );

            return;
        }


        forgotButton.disabled = true;

        forgotButton.textContent =
            "Gönderiliyor...";


        try {

            const { error } =
                await supabaseClient.auth
                    .resetPasswordForEmail(

                        email,

                        {

                            redirectTo:
                                window.location.origin +
                                "/auth.html"

                        }

                    );


            if (error) {

                throw error;

            }


            showMessage(
                "Şifre yenileme bağlantısı e-posta adresine gönderildi.",
                "success"
            );


        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Şifre yenileme bağlantısı gönderilemedi."
            );

        } finally {

            forgotButton.disabled = false;

            forgotButton.textContent =
                "Şifremi Unuttum";

        }

    });


    /* =========================================
       SAYFA AÇILINCA KONTROL
       
       BURADA OTOMATİK YÖNLENDİRME YOK.
       Böylece auth.html <-> profil.html
       arasında döngü oluşmaz.
    ========================================= */

    async function checkCurrentSession() {

        try {

            const {
                data: { session }
            } = await supabaseClient.auth.getSession();


            if (session) {

                /*
                 * Kullanıcı zaten giriş yapmışsa
                 * sadece Giriş Yap butonunun
                 * metnini değiştiriyoruz.
                 *
                 * OTOMATİK REDIRECT YAPMIYORUZ.
                 */

                const navLinks =
                    document.querySelectorAll(
                        ".main-nav a"
                    );


                navLinks.forEach(function (link) {

                    if (
                        link.getAttribute("href") ===
                        "auth.html"
                    ) {

                        link.textContent =
                            "Hesabım";

                    }

                });

            }

        } catch (error) {

            console.error(
                "Session kontrolü:",
                error
            );

        }

    }


    checkCurrentSession();


</script>

</body>
</html>
