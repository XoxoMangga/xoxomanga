<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Giriş / Kayıt | XOXO</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .auth-page {
            min-height: calc(100vh - 170px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 430px;
            padding: 40px 30px;
            background: #29252b;
            border: 1px solid #4b424c;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0,0,0,.35);
        }

        .auth-decoration {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .auth-logo {
            margin: 0;
            color: #ed8fba;
            font-size: 38px;
            letter-spacing: 5px;
        }

        .auth-box h2 {
            margin: 8px 0 28px;
            color: #f5dce9;
        }

        .auth-input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 14px;
            border: 1px solid #554c56;
            border-radius: 14px;
            background: #201d22;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .auth-input:focus {
            border-color: #ed8fba;
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 25px;
            background: #ed8fba;
            color: #241f24;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-button:hover {
            background: #f1a1c6;
        }

        .google-button {
            margin-top: 12px;
            background: #454047;
            color: #fff;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: #8f858e;
            font-size: 13px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #403943;
        }

        .auth-switch {
            margin-top: 22px;
            color: #aaa0a8;
            font-size: 14px;
        }

        .auth-switch button {
            border: 0;
            background: none;
            color: #ed8fba;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            min-height: 22px;
            margin-top: 18px;
            color: #ed8fba;
            font-size: 14px;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            color: #bcaeb7;
            text-decoration: none;
            font-size: 13px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {

            .auth-page {
                padding: 25px 15px;
            }

            .auth-box {
                padding: 32px 20px;
            }

        }

    </style>

</head>


<body>


<header class="site-header">

    <div class="logo">
        XOXO
    </div>

    <nav class="main-nav">

        <a href="index.html">
            Ana Sayfa
        </a>

        <a href="manga.html">
            Manga
        </a>

        <a href="manhwa.html">
            Manhwa
        </a>

        <a href="hakkimizda.html">
            Hakkımızda
        </a>

        <a href="auth.html">
            Giriş Yap
        </a>

    </nav>

</header>



<main class="auth-page">

    <section class="auth-box">

        <div class="auth-decoration">
            ✦ 🪽 ✦
        </div>

        <h1 class="auth-logo">
            XOXO
        </h1>

        <h2 id="formTitle">
            Giriş Yap
        </h2>


        <input
            type="email"
            id="email"
            class="auth-input"
            placeholder="Email adresin"
            autocomplete="email"
        >


        <input
            type="password"
            id="password"
            class="auth-input"
            placeholder="Şifren"
            autocomplete="current-password"
        >


        <input
            type="password"
            id="passwordConfirm"
            class="auth-input hidden"
            placeholder="Şifreni tekrar gir"
            autocomplete="new-password"
        >


        <button
            id="submitBtn"
            class="auth-button"
            type="button"
        >
            Giriş Yap
        </button>


        <div class="auth-divider">
            veya
        </div>


        <button
            id="googleBtn"
            class="auth-button google-button"
            type="button"
        >
            Google ile devam et
        </button>


        <p id="message"></p>


        <div class="auth-switch">

            <span id="switchText">
                Hesabın yok mu?
            </span>

            <button
                id="switchBtn"
                type="button"
            >
                Hesap oluştur
            </button>

        </div>


        <a
            href="index.html"
            class="back-home"
        >
            ← Ana sayfaya dön
        </a>

    </section>

</main>



<footer class="site-footer">

    <p>
        © 2026 XOXO Manga
    </p>

</footer>



<!-- SUPABASE -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>

    const SUPABASE_URL =
        "https://gldvzlfuupettcauexfy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H";


    const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    let registerMode = false;


    const formTitle =
        document.getElementById("formTitle");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const passwordConfirm =
        document.getElementById("passwordConfirm");

    const submitBtn =
        document.getElementById("submitBtn");

    const googleBtn =
        document.getElementById("googleBtn");

    const switchBtn =
        document.getElementById("switchBtn");

    const switchText =
        document.getElementById("switchText");

    const message =
        document.getElementById("message");



    function showMessage(text) {

        message.textContent = text;

    }



    switchBtn.addEventListener(
        "click",
        function () {

            registerMode = !registerMode;

            showMessage("");


            if (registerMode) {

                formTitle.textContent =
                    "Hesap Oluştur";

                submitBtn.textContent =
                    "Kayıt Ol";

                passwordConfirm.classList.remove(
                    "hidden"
                );

                switchText.textContent =
                    "Zaten hesabın var mı?";

                switchBtn.textContent =
                    "Giriş yap";

            } else {

                formTitle.textContent =
                    "Giriş Yap";

                submitBtn.textContent =
                    "Giriş Yap";

                passwordConfirm.classList.add(
                    "hidden"
                );

                switchText.textContent =
                    "Hesabın yok mu?";

                switchBtn.textContent =
                    "Hesap oluştur";

            }

        }
    );



    submitBtn.addEventListener(
        "click",
        async function () {

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            const confirmPassword =
                passwordConfirm.value;


            if (!email || !password) {

                showMessage(
                    "Email ve şifre gerekli."
                );

                return;
            }


            if (password.length < 6) {

                showMessage(
                    "Şifre en az 6 karakter olmalı."
                );

                return;
            }



            submitBtn.disabled = true;

            submitBtn.textContent =
                registerMode
                    ? "Kayıt yapılıyor..."
                    : "Giriş yapılıyor...";


            try {


                if (registerMode) {


                    if (
                        password !==
                        confirmPassword
                    ) {

                        showMessage(
                            "Şifreler eşleşmiyor."
                        );

                        return;
                    }



                    const {
                        data,
                        error
                    } =
                    await db.auth.signUp({

                        email: email,

                        password: password

                    });


                    if (error) {

                        throw error;

                    }



                    if (
                        data.user &&
                        data.session
                    ) {

                        showMessage(
                            "Kayıt başarılı! Profiline yönlendiriliyorsun..."
                        );

                        setTimeout(
                            function () {

                                window.location.href =
                                    "profil.html";

                            },
                            1000
                        );

                    } else {

                        showMessage(
                            "Kayıt başarılı! Email adresini doğrula."
                        );

                    }


                } else {


                    const {
                        data,
                        error
                    } =
                    await db.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                    if (error) {

                        throw error;

                    }


                    showMessage(
                        "Giriş başarılı! Yönlendiriliyorsun..."
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                "profil.html";

                        },
                        700
                    );

                }


            } catch (error) {

                console.error(error);

                showMessage(
                    error.message ||
                    "Bir hata oluştu."
                );

            } finally {

                submitBtn.disabled = false;

                submitBtn.textContent =
                    registerMode
                        ? "Kayıt Ol"
                        : "Giriş Yap";

            }

        }
    );



    googleBtn.addEventListener(
        "click",
        async function () {

            googleBtn.disabled = true;

            googleBtn.textContent =
                "Google'a yönlendiriliyor...";


            try {

                const {
                    error
                } =
                await db.auth.signInWithOAuth({

                    provider: "google",

                    options: {

                        redirectTo:
                            window.location.origin +
                            "/profil.html"

                    }

                });


                if (error) {

                    throw error;

                }


            } catch (error) {

                console.error(error);

                showMessage(
                    error.message ||
                    "Google ile giriş başarısız."
                );

                googleBtn.disabled = false;

                googleBtn.textContent =
                    "Google ile devam et";

            }

        }
    );



    async function checkExistingSession() {

        const {
            data
        } =
        await db.auth.getSession();


        if (data.session) {

            window.location.href =
                "profil.html";

        }

    }


    checkExistingSession();

</script>


</body>
</html>
