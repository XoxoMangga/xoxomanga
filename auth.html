<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giriş Yap | XOXO Manga</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="logo">
        XOXO
    </div>

    <nav class="main-nav">

        <a href="index.html">
            Ana Sayfa
        </a>

        <a href="manga.html">
            Manga
        </a>

        <a href="manhwa.html">
            Manhwa
        </a>

        <a href="hakkimizda.html">
            Hakkımızda
        </a>

        <a href="auth.html" id="authNavLink">
            Giriş Yap
        </a>

    </nav>

</header>


<main class="auth-page">

    <section class="auth-box">

        <div class="angel-decoration">
            ✦ 🪽 ✦
        </div>

        <h1>
            XOXO
        </h1>

        <p class="auth-subtitle">
            Manga dünyasına hoş geldin ♡
        </p>


        <!-- GİRİŞ -->

        <div id="loginSection">

            <h2>
                Giriş Yap
            </h2>


            <div class="input-group">

                <label for="loginEmail">
                    E-posta
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="E-posta adresin"
                    autocomplete="email"
                >

            </div>


            <div class="input-group">

                <label for="loginPassword">
                    Şifre
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Şifren"
                    autocomplete="current-password"
                >

            </div>


            <button
                class="auth-button"
                id="loginButton"
                type="button"
            >
                Giriş Yap
            </button>


            <button
                class="forgot-button"
                id="forgotButton"
                type="button"
            >
                Şifremi Unuttum
            </button>


            <p class="switch-text">
                Hesabın yok mu?
            </p>

            <button
                class="switch-button"
                id="showRegisterButton"
                type="button"
            >
                Kayıt Ol
            </button>

        </div>


        <!-- KAYIT -->

        <div id="registerSection" style="display: none;">

            <h2>
                Kayıt Ol
            </h2>


            <div class="input-group">

                <label for="registerUsername">
                    Kullanıcı Adı
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Kullanıcı adın"
                    autocomplete="username"
                    maxlength="30"
                >

            </div>


            <div class="input-group">

                <label for="registerEmail">
                    E-posta
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="E-posta adresin"
                    autocomplete="email"
                >

            </div>


            <div class="input-group">

                <label for="registerPassword">
                    Şifre
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Şifren"
                    autocomplete="new-password"
                >

            </div>


            <button
                class="auth-button"
                id="registerButton"
                type="button"
            >
                Kayıt Ol
            </button>


            <p class="switch-text">
                Zaten hesabın var mı?
            </p>

            <button
                class="switch-button"
                id="showLoginButton"
                type="button"
            >
                Giriş Yap
            </button>

        </div>


        <!-- MESAJ -->

        <div id="message"></div>


        <footer>
            © 2026 XOXO Manga
        </footer>

    </section>

</main>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================================================
   SUPABASE
========================================================= */

const supabase = createClient(

    "https://gldvzlfuupettcauexfy.supabase.co",

    "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H"

);


/* =========================================================
   ELEMENTLER
========================================================= */

const loginSection =
    document.getElementById("loginSection");

const registerSection =
    document.getElementById("registerSection");

const loginButton =
    document.getElementById("loginButton");

const registerButton =
    document.getElementById("registerButton");

const forgotButton =
    document.getElementById("forgotButton");

const showRegisterButton =
    document.getElementById("showRegisterButton");

const showLoginButton =
    document.getElementById("showLoginButton");

const message =
    document.getElementById("message");

const authNavLink =
    document.getElementById("authNavLink");


/* =========================================================
   MESAJ
========================================================= */

function showMessage(text, type = "") {

    message.textContent = text;

    message.className = "";

    if (type) {
        message.classList.add(type);
    }

}


/* =========================================================
   GİRİŞ / KAYIT GEÇİŞİ
========================================================= */

showRegisterButton.addEventListener(
    "click",
    () => {

        loginSection.style.display = "none";

        registerSection.style.display = "block";

        showMessage("");

    }
);


showLoginButton.addEventListener(
    "click",
    () => {

        registerSection.style.display = "none";

        loginSection.style.display = "block";

        showMessage("");

    }
);


/* =========================================================
   GİRİŞ YAP
========================================================= */

loginButton.addEventListener(
    "click",
    async () => {

        const email =
            document.getElementById("loginEmail")
            .value
            .trim();

        const password =
            document.getElementById("loginPassword")
            .value;


        if (!email || !password) {

            showMessage(
                "E-posta ve şifreyi doldur.",
                "error"
            );

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Giriş yapılıyor...";


        const { data, error } =
            await supabase.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            showMessage(
                error.message,
                "error"
            );

            loginButton.disabled = false;

            loginButton.textContent =
                "Giriş Yap";

            return;

        }


        showMessage(
            "Giriş başarılı! ♡",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    "index.html";

            },
            500
        );

    }
);


/* =========================================================
   KAYIT OL
========================================================= */

registerButton.addEventListener(
    "click",
    async () => {

        const username =
            document.getElementById("registerUsername")
            .value
            .trim();

        const email =
            document.getElementById("registerEmail")
            .value
            .trim();

        const password =
            document.getElementById("registerPassword")
            .value;


        /* KULLANICI ADI KONTROL */

        if (!username) {

            showMessage(
                "Kullanıcı adı gir.",
                "error"
            );

            return;

        }


        if (username.length < 3) {

            showMessage(
                "Kullanıcı adı en az 3 karakter olmalı.",
                "error"
            );

            return;

        }


        if (!email || !password) {

            showMessage(
                "E-posta ve şifreyi doldur.",
                "error"
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "Şifre en az 6 karakter olmalı.",
                "error"
            );

            return;

        }


        registerButton.disabled = true;

        registerButton.textContent =
            "Kayıt oluşturuluyor...";


        /* SUPABASE KAYIT */

        const { data, error } =
            await supabase.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {

                        username: username

                    }

                }

            });


        if (error) {

            showMessage(
                error.message,
                "error"
            );

            registerButton.disabled = false;

            registerButton.textContent =
                "Kayıt Ol";

            return;

        }


        /*
            E-posta doğrulaması kapalıysa
            kullanıcı direkt giriş yapmış olur.
        */

        if (data.session) {

            showMessage(
                "Kayıt başarılı! Hoş geldin ♡",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                700
            );


        } else {

            /*
                Eğer Supabase tarafında
                e-posta doğrulaması açıksa
            */

            showMessage(
                "Kayıt başarılı! E-posta adresini kontrol et.",
                "success"
            );


            registerButton.disabled = false;

            registerButton.textContent =
                "Kayıt Ol";

        }

    }
);


/* =========================================================
   ŞİFREMİ UNUTTUM
========================================================= */

forgotButton.addEventListener(
    "click",
    async () => {

        const email =
            document.getElementById("loginEmail")
            .value
            .trim();


        if (!email) {

            showMessage(
                "Önce e-posta adresini gir.",
                "error"
            );

            return;

        }


        forgotButton.disabled = true;

        forgotButton.textContent =
            "Gönderiliyor...";


        const { error } =
            await supabase.auth.resetPasswordForEmail(

                email,

                {

                    redirectTo:
                        window.location.origin +
                        "/auth.html"

                }

            );


        if (error) {

            showMessage(
                error.message,
                "error"
            );

        } else {

            showMessage(
                "Şifre yenileme bağlantısı e-posta adresine gönderildi.",
                "success"
            );

        }


        forgotButton.disabled = false;

        forgotButton.textContent =
            "Şifremi Unuttum";

    }
);


/* =========================================================
   OTURUM KONTROLÜ
========================================================= */

async function updateAuthMenu() {

    const {
        data: { session }
    } = await supabase.auth.getSession();


    if (!authNavLink) return;


    if (session) {

        authNavLink.textContent =
            "Profil";

        authNavLink.href =
            "profil.html";

    } else {

        authNavLink.textContent =
            "Giriş Yap";

        authNavLink.href =
            "auth.html";

    }

}


updateAuthMenu();


supabase.auth.onAuthStateChange(
    () => {

        updateAuthMenu();

    }
);


/* =========================================================
   ZATEN GİRİŞ YAPILDIYSA
========================================================= */

async function checkCurrentSession() {

    const {
        data: { session }
    } = await supabase.auth.getSession();


    if (session) {

        /*
            Auth sayfasına tekrar gelirse
            profil sayfasına gönder.
        */

        window.location.href =
            "profil.html";

    }

}


checkCurrentSession();

</script>

</body>
</html>
