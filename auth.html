<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giriş | XoxoManga</title>

    <!-- AYRI CSS DOSYASI -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <div class="angel-decoration">
                ✦ 🪽 ✦
            </div>

           <h1>XOXO Manga</h1>

            <p class="auth-subtitle">
                Manga ve manhwa dünyasına hoş geldin ♡
            </p>


            <!-- FORM BAŞLIĞI -->

            <h2 id="formTitle">
                Giriş Yap
            </h2>


            <!-- E-POSTA -->

            <div class="input-group">

                <label for="email">
                    E-posta
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="E-posta adresin"
                    autocomplete="email"
                >

            </div>


            <!-- ŞİFRE -->

            <div class="input-group">

                <label for="password">
                    Şifre
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Şifren"
                    autocomplete="current-password"
                >

            </div>


            <!-- GİRİŞ / KAYIT -->

            <button
                id="submitBtn"
                class="auth-button"
                type="button"
            >
                Giriş Yap
            </button>


            <!-- ŞİFREMİ UNUTTUM -->

            <button
                id="forgotBtn"
                class="forgot-button"
                type="button"
            >
                Şifremi unuttum
            </button>


            <!-- KAYIT / GİRİŞ DEĞİŞTİR -->

            <p class="switch-text">

                <span id="switchText">
                    Hesabın yok mu?
                </span>

            </p>

            <button
                id="switchBtn"
                class="switch-button"
                type="button"
            >
                Hesap Oluştur
            </button>


            <!-- MESAJ -->

            <p id="message"></p>


            <!-- FOOTER -->

            <footer>
                © 2026 XoxoManga
            </footer>

        </div>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =====================================================
           SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            "https://gldvzlfuupettcauexfy.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H";


        const { createClient } = supabase;

        const db = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        /* =====================================================
           ELEMENTLER
        ===================================================== */

        const formTitle =
            document.getElementById("formTitle");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const submitBtn =
            document.getElementById("submitBtn");

        const forgotBtn =
            document.getElementById("forgotBtn");

        const switchBtn =
            document.getElementById("switchBtn");

        const switchText =
            document.getElementById("switchText");

        const message =
            document.getElementById("message");


        /* =====================================================
           MOD
        ===================================================== */

        let isSignUp = false;


        /* =====================================================
           MESAJ
        ===================================================== */

        function showMessage(text, type = "") {

            message.textContent = text;

            message.className = type;

        }


        /* =====================================================
           GİRİŞ / KAYIT DEĞİŞTİR
        ===================================================== */

        switchBtn.addEventListener(
            "click",
            function () {

                isSignUp = !isSignUp;

                showMessage("");

                passwordInput.value = "";


                if (isSignUp) {

                    formTitle.textContent =
                        "Hesap Oluştur";

                    submitBtn.textContent =
                        "Kayıt Ol";

                    switchText.textContent =
                        "Zaten hesabın var mı?";

                    switchBtn.textContent =
                        "Giriş Yap";

                    forgotBtn.style.display =
                        "none";

                } else {

                    formTitle.textContent =
                        "Giriş Yap";

                    submitBtn.textContent =
                        "Giriş Yap";

                    switchText.textContent =
                        "Hesabın yok mu?";

                    switchBtn.textContent =
                        "Hesap Oluştur";

                    forgotBtn.style.display =
                        "inline-block";

                }

            }
        );


        /* =====================================================
           KAYIT / GİRİŞ
        ===================================================== */

        submitBtn.addEventListener(
            "click",
            async function () {

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                if (!email) {

                    showMessage(
                        "E-posta adresini gir.",
                        "error"
                    );

                    return;
                }


                if (!password) {

                    showMessage(
                        "Şifreni gir.",
                        "error"
                    );

                    return;
                }


                if (password.length < 6) {

                    showMessage(
                        "Şifre en az 6 karakter olmalı.",
                        "error"
                    );

                    return;
                }


                submitBtn.disabled = true;


                if (isSignUp) {

                    submitBtn.textContent =
                        "Kayıt oluşturuluyor...";

                } else {

                    submitBtn.textContent =
                        "Giriş yapılıyor...";

                }


                showMessage("");


                try {

                    /* =========================
                       KAYIT
                    ========================= */

                    if (isSignUp) {

                        const {
                            data,
                            error
                        } = await db.auth.signUp({
                            email: email,
                            password: password
                        });


                        if (error) {
                            throw error;
                        }


                        if (!data.session) {

                            showMessage(
                                "Kayıt başarılı! E-posta adresini doğrula.",
                                "success"
                            );

                        } else {

                            showMessage(
                                "Hesabın oluşturuldu!",
                                "success"
                            );


                            setTimeout(
                                function () {

                                    window.location.href =
                                        "index.html";

                                },
                                800
                            );

                        }

                    }


                    /* =========================
                       GİRİŞ
                    ========================= */

                    else {

                        const {
                            data,
                            error
                        } = await db.auth.signInWithPassword({

                            email: email,

                            password: password

                        });


                        if (error) {
                            throw error;
                        }


                        if (!data.session) {

                            throw new Error(
                                "Oturum oluşturulamadı."
                            );

                        }


                        showMessage(
                            "Giriş başarılı! Yönlendiriliyorsun...",
                            "success"
                        );


                        setTimeout(
                            function () {

                                window.location.href =
                                    "index.html";

                            },
                            700
                        );

                    }


                } catch (error) {

                    console.error(
                        "Auth hatası:",
                        error
                    );


                    let errorText =
                        error.message ||
                        "Bir hata oluştu.";


                    if (
                        errorText
                            .toLowerCase()
                            .includes(
                                "invalid login credentials"
                            )
                    ) {

                        errorText =
                            "E-posta veya şifre yanlış.";

                    }


                    if (
                        errorText
                            .toLowerCase()
                            .includes(
                                "user already registered"
                            )
                    ) {

                        errorText =
                            "Bu e-posta ile zaten bir hesap var.";

                    }


                    showMessage(
                        errorText,
                        "error"
                    );

                } finally {

                    submitBtn.disabled =
                        false;


                    if (isSignUp) {

                        submitBtn.textContent =
                            "Kayıt Ol";

                    } else {

                        submitBtn.textContent =
                            "Giriş Yap";

                    }

                }

            }
        );


        /* =====================================================
           ŞİFREMİ UNUTTUM
        ===================================================== */

        forgotBtn.addEventListener(
            "click",
            async function () {

                const email =
                    emailInput.value.trim();


                if (!email) {

                    showMessage(
                        "Önce e-posta adresini gir.",
                        "error"
                    );

                    emailInput.focus();

                    return;
                }


                forgotBtn.disabled = true;


                showMessage(
                    "Sıfırlama bağlantısı gönderiliyor..."
                );


                try {

                    const {
                        error
                    } = await db.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                window.location.origin +
                                "/auth.html"
                        }
                    );


                    if (error) {
                        throw error;
                    }


                    showMessage(
                        "Şifre sıfırlama bağlantısı gönderildi.",
                        "success"
                    );


                } catch (error) {

                    console.error(
                        "Şifre sıfırlama hatası:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Şifre sıfırlama başarısız.",
                        "error"
                    );

                } finally {

                    forgotBtn.disabled =
                        false;

                }

            }
        );


        /* =====================================================
           OTURUM KONTROLÜ
        ===================================================== */

        async function checkSession() {

            const {
                data
            } = await db.auth.getSession();


            if (data.session) {

                window.location.href =
                    "index.html";

            }

        }


        checkSession();

    </script>

</body>
</html>
