<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap | XOXO Manga</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="site-header">

    <div class="logo">XOXO</div>

    <nav class="main-nav">
        <a href="index.html">Ana Sayfa</a>
        <a href="manga.html">Manga</a>
        <a href="manhwa.html">Manhwa</a>
        <a href="hakkimizda.html">Hakkımızda</a>

        <a href="profil.html" id="authNavLink">
            Giriş Yap
        </a>
    </nav>

</header>


<main class="auth-page">

<section class="auth-box">

    <div class="angel-decoration">
        ✦ 🪽 ✦
    </div>

    <h1>XOXO</h1>

    <p class="auth-subtitle">
        Manga dünyasına hoş geldin ♡
    </p>


    <!-- =========================
         GİRİŞ
    ========================== -->

    <div id="loginSection">

        <h2>Giriş Yap</h2>

        <div class="input-group">

            <label for="loginEmail">
                E-posta
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="E-posta adresin"
                autocomplete="email"
            >

        </div>


        <div class="input-group">

            <label for="loginPassword">
                Şifre
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Şifren"
                autocomplete="current-password"
            >

        </div>


        <button
            type="button"
            class="auth-button"
            id="loginButton"
        >
            Giriş Yap
        </button>


        <button
            type="button"
            class="forgot-button"
            id="forgotButton"
        >
            Şifremi Unuttum
        </button>


        <p class="switch-text">
            Hesabın yok mu?
        </p>

        <button
            type="button"
            class="switch-button"
            id="showRegisterButton"
        >
            Kayıt Ol
        </button>

    </div>


    <!-- =========================
         KAYIT
    ========================== -->

    <div id="registerSection" hidden>

        <h2>Kayıt Ol</h2>


        <div class="input-group">

            <label for="registerUsername">
                Kullanıcı Adı
            </label>

            <input
                type="text"
                id="registerUsername"
                placeholder="Kullanıcı adın"
                maxlength="30"
                autocomplete="username"
            >

        </div>


        <div class="input-group">

            <label for="registerEmail">
                E-posta
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="E-posta adresin"
                autocomplete="email"
            >

        </div>


        <div class="input-group">

            <label for="registerPassword">
                Şifre
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="En az 6 karakter"
                autocomplete="new-password"
            >

        </div>


        <button
            type="button"
            class="auth-button"
            id="registerButton"
        >
            Kayıt Ol
        </button>


        <p class="switch-text">
            Zaten hesabın var mı?
        </p>

        <button
            type="button"
            class="switch-button"
            id="showLoginButton"
        >
            Giriş Yap
        </button>

    </div>


    <div id="message" aria-live="polite"></div>


    <footer>
        © 2026 XOXO Manga
    </footer>

</section>

</main>


<script>

const SUPABASE_URL =
    "https://gldvzlfuupettcauexfy.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_LQRuadaAeDNPSQAiSA32qA_ddQP5g1H";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


const loginSection =
    document.getElementById("loginSection");

const registerSection =
    document.getElementById("registerSection");

const message =
    document.getElementById("message");

const loginEmail =
    document.getElementById("loginEmail");

const loginPassword =
    document.getElementById("loginPassword");

const registerUsername =
    document.getElementById("registerUsername");

const registerEmail =
    document.getElementById("registerEmail");

const registerPassword =
    document.getElementById("registerPassword");

const loginButton =
    document.getElementById("loginButton");

const registerButton =
    document.getElementById("registerButton");

const forgotButton =
    document.getElementById("forgotButton");

const authNavLink =
    document.getElementById("authNavLink");


function showMessage(text, type = "") {

    message.textContent = text;
    message.className = type;

}


function showLogin() {

    registerSection.hidden = true;
    loginSection.hidden = false;

    showMessage("");

}


function showRegister() {

    loginSection.hidden = true;
    registerSection.hidden = false;

    showMessage("");

}


function updateAuthMenu(session) {

    if (session) {

        authNavLink.textContent = "Profil";
        authNavLink.href = "profil.html";

    } else {

        authNavLink.textContent = "Giriş Yap";
        authNavLink.href = "auth.html";

    }

}


document
    .getElementById("showRegisterButton")
    .addEventListener("click", showRegister);


document
    .getElementById("showLoginButton")
    .addEventListener("click", showLogin);



/* =========================
   GİRİŞ
========================= */

loginButton.addEventListener(
    "click",
    async () => {

        const email =
            loginEmail.value.trim();

        const password =
            loginPassword.value;


        if (!email || !password) {

            showMessage(
                "E-posta ve şifreyi doldur.",
                "error"
            );

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Giriş yapılıyor...";


        const { data, error } =
            await supabaseClient.auth
                .signInWithPassword({
                    email,
                    password
                });


        if (error) {

            showMessage(
                error.message,
                "error"
            );

            loginButton.disabled = false;

            loginButton.textContent =
                "Giriş Yap";

            return;
        }


        updateAuthMenu(data.session);

        showMessage(
            "Giriş başarılı ♡",
            "success"
        );


        setTimeout(() => {

            window.location.replace(
                "profil.html"
            );

        }, 400);

    }
);



/* =========================
   KAYIT
========================= */

registerButton.addEventListener(
    "click",
    async () => {

        const username =
            registerUsername.value.trim();

        const email =
            registerEmail.value.trim();

        const password =
            registerPassword.value;


        if (!username || !email || !password) {

            showMessage(
                "Tüm alanları doldurmalısın.",
                "error"
            );

            return;
        }


        if (username.length < 3) {

            showMessage(
                "Kullanıcı adı en az 3 karakter olmalı.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Şifre en az 6 karakter olmalı.",
                "error"
            );

            return;
        }


        registerButton.disabled = true;

        registerButton.textContent =
            "Kayıt olunuyor...";


        const { data, error } =
            await supabaseClient.auth
                .signUp({

                    email,
                    password,

                    options: {

                        data: {

                            username: username,

                            avatar_url: ""

                        }

                    }

                });


        if (error) {

            showMessage(
                error.message,
                "error"
            );

            registerButton.disabled = false;

            registerButton.textContent =
                "Kayıt Ol";

            return;
        }


        if (data.session) {

            updateAuthMenu(data.session);

            showMessage(
                "Hesabın oluşturuldu ♡",
                "success"
            );


            setTimeout(() => {

                window.location.replace(
                    "profil.html"
                );

            }, 400);


        } else {

            showMessage(
                "Kayıt başarılı ♡ E-posta adresini doğrula.",
                "success"
            );

            registerButton.disabled = false;

            registerButton.textContent =
                "Kayıt Ol";

        }

    }
);



/* =========================
   ŞİFREMİ UNUTTUM
========================= */

forgotButton.addEventListener(
    "click",
    async () => {

        const email =
            loginEmail.value.trim();


        if (!email) {

            showMessage(
                "Önce e-posta adresini yaz.",
                "error"
            );

            return;
        }


        forgotButton.disabled = true;

        forgotButton.textContent =
            "Gönderiliyor...";


        const { error } =
            await supabaseClient.auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            window.location.origin +
                            "/xoxomanga/auth.html"
                    }
                );


        if (error) {

            showMessage(
                error.message,
                "error"
            );

        } else {

            showMessage(
                "Şifre yenileme bağlantısı e-posta adresine gönderildi.",
                "success"
            );

        }


        forgotButton.disabled = false;

        forgotButton.textContent =
            "Şifremi Unuttum";

    }
);



/* =========================
   SAYFA AÇILINCA
========================= */

(async () => {

    const { data } =
        await supabaseClient.auth.getSession();


    updateAuthMenu(data.session);

})();


supabaseClient.auth.onAuthStateChange(
    (_event, session) => {

        updateAuthMenu(session);

    }
);

</script>

</body>
</html>
